<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexius - Javascript</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles/codicon.css">
    <link rel="stylesheet" href="/assets/styles/theme.css">
    <link rel="stylesheet" href="/assets/styles/index.css">
    <link rel="stylesheet" href="/assets/styles/component.css">
    <link rel="stylesheet" href="/assets/styles/github-markdown.css">
    <link rel="stylesheet" href="/assets/styles/hljs-github.min.css">
    <link rel="stylesheet" href="/assets/styles/pilcrow.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-html.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-postcss.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets/highlight.min.js"></script>
    <script src="https://kit.fontawesome.com/1460605c6c.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://esm.sh/@pfmcodes/caret@0.2.9/index.css"">
    <script>
        // Wait for all prettier scripts to load
        window.addEventListener('load', function() {
            // Give it a moment to ensure all scripts are loaded
            setTimeout(() => {
                console.log('Prettier loaded:', typeof prettier !== 'undefined');
                console.log('Prettier plugins:', typeof prettierPlugins !== 'undefined');
            }, 100);
        });
    </script>
</head>
<body>
    <!-- <div class="loading-screen">
        <img class="logo" style="background: none" src="/assets/images/favicon.svg" alt="Lexius Logo">
        <div class="loading-bar">
            
        </div>
    </div> -->
    <div class='extras'>
        <div class="workspacesOptions Options">
            <div class="clickable option btn btn--ghost btn--sm active">
                Open a Workspace
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm">
                Create New Workspace
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm">
                Manage Workspaces
            </div>
        </div>
        <div class="personalizationOptions Options">
            <div class="clickable option btn btn--ghost btn--sm" data-editor="caret">
                <i class="codicon codicon-symbol-class"></i> Caret (Lightweight)
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm" data-editor="monaco">
                <i class="codicon codicon-symbol-method"></i> Monaco (Recomended)
            </div>
        </div>
        <div class="themeOptions Options">
            <div class="clickable option btn btn--ghost btn--sm active">
                <i class="codicon codicon-color-mode"></i>
                System Default
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm">
                <i data-lucide="sun" class="icons"></i>
                Light
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm">
                <i data-lucide="moon" class="icons"></i>
                Dark
            </div>
        </div>
        <div class="fileBtnOptions Options">
            <div class="clickable option btn btn--ghost btn--sm" id="open-File">
                <i class="icons" data-lucide="file-input"></i>
                Open File
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm" id="open-folder">
                <i class="icons" data-lucide="folder-input"></i>
                Open Folder
            </div>
            <div class="seperator"></div>
            <div class="clickable option btn btn--ghost btn--sm" id="autosave">
                <i class="icons" data-lucide="save"></i>
                AutoSave
                <div class="true" id='autosave-check'></div>
            </div>
        </div>
    </div>
    <nav class="nav-bar panel panel--borderless">
        <div class="options">
            <div class="logo">
                <img class="log0-img" src="/assets/images/favicon.svg" alt="Lexius Logo">
            </div>
            <div class="option">
                <button class="clickable btn btn--ghost btn--sm" id="File">
                <i class="codicon codicon-file"></i>
                File
                </button>
            </div>
            <div class="option">
                <button class="clickable btn btn--ghost btn--sm" id="Theme">
                <i class="codicon codicon-color-mode"></i>
                Theme
                </button>
            </div>
            <div class="option">
                <button class="clickable btn btn--ghost btn--sm" id="Workspaces">
                <i class="codicon codicon-symbol-folder"></i>
                Workspaces
                </button>
            </div>
            <div class="option">
                <button class="clickable btn btn--ghost btn--sm" id="Personalization">
                    <i class="icons codicon codicon-settings" ></i>
                Personalization
                </button>
            </div>
            <div class="language">
                <i class="codicon codicon-json"></i>
                <p id="language"></p>
            </div>
        </div>
        <div class="right-side">
            <div>
                <button id="runCode" class="runBtn btn btn--secondary btn--md" style="font-size: 18px !important; border: none;"><i data-lucide="play"></i></button>
            </div>
            <div class="ProjectName" id="ProjectName">
                <p class="text-ghost">Project Name:</p>
                Untitled
            </div>
        </div>
    </nav>
    <main>
        <div class="sideBar sidebar" id="sideBar">
            <i class="codicon codicon-files" id="closeBtn"></i>
            <!-- <div class="seperator"></div>

            <i id="activateIndu" class="codicon codicon-chat-sparkle sidebar__item"></i>
            <div class="seperator"></div> -->
            
            <i id="activateTerminal" class="codicon codicon-terminal-cmd sidebar__item"></i>
            <div class="seperator"></div>

            <i id="comingSoon" onclick="window.kn()" class="codicon" style="width: 28px !important;" data-lucide="megaphone"></i>
        </div>
        <div class="files-tab tab-bar resizable" id="files-tab">
            <div class="fileMenu tab-bar__header">
                <p class="project-name tab-bar__title"></p>
                <div id="menu" class="tab-bar__actions">
                    <i class="codicon codicon-new-file" id="newFile"></i>
                    <i class="codicon codicon-new-folder" id="newFolder"></i>
                    <i class="codicon codicon-refresh"></i>
                </div>
            </div>
            <div class="files tab-bar__content">
                
            </div>
        </div>
        <div class="drag-bar" data-direction="horizontal"></div>
        <div id="megaEditor">
            <div class="resizable" id="editor"></div>
            <div class="iframe"></div>
            <div class="codeWindow">
                <div class="codeWindow-nav" style="display: flex; justify-content: space-between; align-items: center; color: var(--color-text-secondary);">
                    <div class="otherSide"  style="display: flex; align-items: center; gap: 10px;">
                        <img id="N-logo" src="/assets/images/favicon.svg" style="width: 32px;" alt="Lexius">
                        <p id="N-Title"></p>
                    </div>
                    <i style="cursor: pointer;" data-lucide="x" id="N-X"></i>
                </div>

                <div class="N-parent" id="N-parent">
                    <img src="" alt="" class="N-thumbnail" id="N-thumbnail">
                    <div class="codeWindow-content markdown-body" id="N-body" style="padding: 10px; margin: 20px; margin-top: 10px;"></div>
                </div>
            </div>
        </div>
        <!-- <div class="indu drag-bar" data-direction="horizontal"></div>
        <div class="indu resizable" id="indu">
            <div class="header">
             <div class="header">
                <div>
                    <img src="/assets/images/indu.png">
                </div>
                <div align="center">Indu is a code assistant made for you, to improve</div>
            </div>
            <div id="chat"></div>
            <div class="input">
                <input type="text" id="induInput"> <button id="induSendBtn"><i style="font-size: 10px" data-lucide="arrow-right"></i></button>
            </div>
        </div> -->
        <div class="terminal panel panel--filled" style="display:none;">
            <div class="nav-terminal">
                <div class="btn btn--ghost btn--sm" onclick="this.closest('.terminal').style.display = 'none';">
                    <i data-lucide="x"></i>
                </div>
            </div>
            <div class="terminal-display" id="terminal-display">
                $
            </div>
        </div>
    </main>
    <div class="right-click-menu context-menu" id="rightClickMenu">
        <button class="context-menu__item" id="newFileCtx"><i class="codicon codicon-new-file context-menu__icon"></i> New File</button>
        <button class="context-menu__item" id="newFolderCtx"><i class="codicon codicon-new-folder context-menu__icon"></i> New Folder</button>
        <button class="context-menu__item" id="renameFile"><i data-lucide="pencil" class="context-menu__icon"></i> Rename</button>
        <button class="context-menu__item context-menu__item--danger" id="deleteFile"><i data-lucide="trash" class="context-menu__icon"></i> Delete</button>
        <button class="context-menu__item" id="openFile"><i data-lucide="square-arrow-out-up-right" class="context-menu__icon"></i> Open in Editor</button>
    </div>
    <script>
        // Initialize lucide icons after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
    <script type="module" src="/assets/scripts/langs.js.js"></script>
    <script type="module" src="/assets/scripts/monaco.js"></script>
    <script type="module" src="/assets/scripts/db.js"></script>
    <script type="module" src="/assets/scripts/navbar.js"></script>
</body>
</html>
